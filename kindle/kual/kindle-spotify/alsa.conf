# Private ALSA configuration; does not replace /etc/asound.conf.
# Convert Soloist's sample format to the Kindle mixer's PCM format.
pcm.kindle {
    type plug
    slave {
        format S16_LE
        rate 44100
        channels 2
        pcm { type kindle_fifo path "/var/tmp/kindle-spotify/audio.fifo" }
    }
}
pcm_type.kindle_fifo {
    lib "/var/tmp/kindle-spotify/lib/libasound_module_pcm_kindle_fifo.so"
}
